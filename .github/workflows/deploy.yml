name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Audio de cada tesis con voz neuronal (Piper, es_AR). Sigue sonando con la pantalla apagada.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            .piper
            public/audio
          key: audio-${{ hashFiles('src/content/tesis/*.md', 'scripts/audio.py') }}
          restore-keys: audio-
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install piper-tts
      - name: Generar audios
        continue-on-error: true
        run: python scripts/audio.py --voz es_AR-daniela-high --modelos .piper
      - run: npm run build
        env:
          # Mientras dure la etapa de revisión se publican también los borradores (con cartel).
          # Para ocultarlos, borrar esta línea.
          PUBLIC_BORRADORES: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
